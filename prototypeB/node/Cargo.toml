[package]
name = "ddn-node"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["serde"] }
rand = "0.8"
hex = "0.4"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = "0.3"
tower-http = { version = "0.5", features = ["fs", "cors"] }
libp2p = { version = "0.52", features = ["tokio", "gossipsub", "kad", "mdns", "noise", "macros", "tcp", "identify"], default-features = false }
x25519-dalek = { version = "2", features = ["serde", "static_secrets"] }
aes-gcm = "0.10"
tokio-util = "0.7"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

[profile.release]
opt-level = 3