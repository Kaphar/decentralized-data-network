[package]
name = "ddn-tauri"
version = "0.1.0"
edition = "2021"
description = "Decentralized Data Network — Tauri desktop shell"

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"] }
